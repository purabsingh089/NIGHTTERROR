name: Validate NIGHTTERROR startup

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Parse Godot project
        run: |
          set -o pipefail
          ./Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load script" godot-import.log; then
            exit 1
          fi

      - name: Run Godot startup smoke test
        run: |
          set -o pipefail
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --quit-after 3 2>&1 | tee godot-runtime.log
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load script|Parse Error" godot-runtime.log; then
            exit 1
          fi
          grep -q "NIGHTTERROR_READY" godot-runtime.log
          grep -q "NIGHTTERROR_FIRST_FRAME" godot-runtime.log
