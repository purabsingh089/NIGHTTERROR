name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Install Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv templates "$HOME/.local/share/godot/export_templates/4.3.stable"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android packages and debug keystore
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          mkdir -p "$HOME/keystore"
          keytool -keyalg RSA -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore "$HOME/keystore/debug.keystore" \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -size 2048 -deststoretype pkcs12
          mkdir -p "$HOME/.config/godot"
          for name in editor_settings-4 editor_settings-4.3; do
            cat > "$HOME/.config/godot/$name.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/keystore/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          mkdir -p build

      - name: Parse Godot project
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Export ARMv7 APK
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug "Android ARMv7" build/NIGHTTERROR-armv7.apk

      - name: Export ARM64 APK
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug "Android ARM64" build/NIGHTTERROR-arm64.apk

      - name: Verify APKs
        run: |
          ls -l build/*.apk
          test -s build/NIGHTTERROR-armv7.apk
          test -s build/NIGHTTERROR-arm64.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nightterror-apks
          path: build/*.apk
